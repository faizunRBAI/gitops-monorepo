apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{/*
Rollouts needs a second Service per strategy: the canary service receives the
weighted slice, the preview service the not-yet-promoted blue/green stack.
Argo Rollouts injects the pod-hash selector into these at runtime — the
template deliberately does not set it.
*/}}
{{- if .Values.canary.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-canary
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- if .Values.blueGreen.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-preview
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
