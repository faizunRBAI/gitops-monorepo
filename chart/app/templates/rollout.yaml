{{/*
Gradual releases. One Rollout resource, two strategies, selected by the mode
switches. Never rendered at the same time as the Deployment above.
*/}}
{{- if eq (include "app.rolloutEnabled" .) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.canary.enabled }}
    canary:
      canaryService: {{ include "app.fullname" . }}-canary
      stableService: {{ include "app.fullname" . }}
      trafficRouting:
        nginx:
          stableIngress: {{ include "app.fullname" . }}
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
    {{- else }}
    blueGreen:
      activeService: {{ include "app.fullname" . }}
      previewService: {{ include "app.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      {{- include "app.podSpec" . | nindent 6 }}
{{- end }}
