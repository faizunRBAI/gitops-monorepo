# Grafana picks this up via the sidecar's `grafana_dashboard` label.
# The panels are built around the `version` label that gitops/scrapes/ relabels
# from the pod-template hash — that is what makes canary vs stable comparable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  delivery.json: |
    {
      "title": "Delivery — canary vs stable",
      "uid": "delivery",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate by version",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (version) (rate(http_requests_total{namespace=\"app-canary\"}[5m]))",
              "legendFormat": "{{version}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx rate by version (canary abort signal)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum by (version) (rate(http_requests_total{namespace=\"app-canary\",status=~\"5..\"}[5m]))",
              "legendFormat": "{{version}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency by version",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, version) (rate(http_request_duration_seconds_bucket{namespace=\"app-canary\"}[5m])))",
              "legendFormat": "{{version}}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "ArgoCD apps out of sync",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(argocd_app_info{sync_status!=\"Synced\"})"
            }
          ]
        }
      ]
    }
