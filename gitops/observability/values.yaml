# kube-prometheus-stack values, referenced by the observability Application's
# $values source. Sized for a 3-node t3.large group — the defaults assume a
# much larger cluster and will leave pods Pending here.

fullnameOverride: observability

prometheus:
  prometheusSpec:
    retention: 7d
    # Discover ServiceMonitors from gitops/scrapes/ regardless of namespace.
    # Without these set to false, the operator only picks up monitors whose
    # labels match the release, and the ArgoCD controller monitor is silently
    # ignored — the exact failure trap 2 exists to prevent.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  # Admin password is generated by the chart into a Secret. Not committed here:
  # secrets do not belong in a GitOps repo (Argo CD secret-management guidance).
  # Read it with:
  #   kubectl get secret observability-grafana -n monitoring \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: []
    path: /grafana
    pathType: Prefix
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      # Matches the label on the ConfigMaps in gitops/dashboards/.
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

alertmanager:
  # No alert routing configured yet, so running Alertmanager would only cost
  # memory and give a false sense of coverage. Listed as an optional
  # enhancement in the plan.
  enabled: false

# The EKS control plane is managed by AWS: these components are not reachable
# for scraping and their ServiceMonitors would sit permanently down, poisoning
# any "targets healthy" panel.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
