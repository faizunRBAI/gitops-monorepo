spring.application.name=gitops-monorepo

# The chart's app.podSpec probes /healthz and the ServiceScrapes hit /metrics,
# both on the container port. Rather than change the chart, the ingress, the
# scrapes and the verify stage to /actuator/**, Actuator is remapped so the
# Java service exposes the SAME HTTP contract the previous Node service did.
# Fewer moving parts change, and every existing guard keeps testing the real
# endpoints.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,prometheus,info

# EXPOSURE IS NOT ENABLEMENT. exposure.include controls which registered
# endpoints are visible over HTTP; management.endpoint.<id>.enabled controls
# whether the endpoint bean is created at all. An endpoint that is included but
# not enabled is silently absent, which is exactly the "Exposing 2 endpoints"
# (health, info) symptom that cost two CI attempts here while /metrics 404'd.
# Stating both explicitly removes the ambiguity for the endpoints this platform
# actually depends on.
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.prometheus.enabled=true

# The prometheus endpoint only materialises when a MeterRegistry for it exists.
# Boot auto-configures one from micrometer-registry-prometheus; making the
# export explicit means a future property change cannot disable it silently.
management.prometheus.metrics.export.enabled=true

# Liveness/readiness groups are enabled so a future split of the two probes is
# a chart change only. /healthz aggregates them today.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# The pod runs read-only with a non-root user; Tomcat must not try to write a
# work directory outside the tmpfs the chart mounts.
server.port=${PORT:8080}
server.tomcat.basedir=/tmp
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
