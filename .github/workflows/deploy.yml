        )].value}' 2>/dev/null || true)\"\necho \"previous_tag=${PREV:-none}\" >>\
        \ \"$GITHUB_OUTPUT\"\necho \"Previous image tag: ${PREV:-none} (none = first\
        \ deploy)\"\n"
    - name: Patch the Application Helm parameter (deploy = cluster state, NOT a git
        commit)
      run: "set -euo pipefail\n# JSON-patch, not merge-patch: a merge on spec.source.helm\
        \ would\n# replace the whole parameters array and drop image.repository and\n\
        # the mode switches that Git owns.\nPARAMS=\"$(kubectl get application app-canary\
        \ -n argocd \\\n  -o jsonpath='{range .spec.source.helm.parameters[*]}{.name}{\"\
        \\n\"}{end}')\"\nIDX=\"$(echo \"$PARAMS\" | grep -n '^image.tag$' | cut -d:\
        \ -f1 || true)\"\nif [ -n \"$IDX\" ]; then\n  kubectl patch application app-canary\
        \ -n argocd --type json \\\n    -p \"[{\\\"op\\\":\\\"replace\\\",\\\"path\\\
        \":\\\"/spec/source/helm/parameters/$((IDX-1))/value\\\",\\\"value\\\":\\\"\
        ${IMAGE_TAG}\\\"}]\"\nelse\n  kubectl patch application app-canary -n argocd\
        \ --type json \\\n    -p \"[{\\\"op\\\":\\\"add\\\",\\\"path\\\":\\\"/spec/source/helm/parameters/-\\\
        \",\\\"value\\\":{\\\"name\\\":\\\"image.tag\\\",\\\"value\\\":\\\"${IMAGE_TAG}\\\
        \"}}]\"\nfi\necho \"app-canary image.tag -> ${IMAGE_TAG}\"\n"
    - name: Hard refresh so ArgoCD re-renders immediately
      run: "kubectl -n argocd annotate application app-canary \\\n  argocd.argoproj.io/refresh=hard\
        \ --overwrite\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - id: tf
      name: Read cluster name from state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw cluster_name)\" >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: App Synced + Healthy
      run: "set -euo pipefail\nkubectl wait --for=jsonpath='{.status.sync.status}'=Synced\
        \ \\\n  application/app-canary -n argocd --timeout=900s\nkubectl wait --for=jsonpath='{.status.health.status}'=Healthy\
        \ \\\n  application/app-canary -n argocd --timeout=900s\n"
    - name: The running image is the one this run built
      run: "set -euo pipefail\nRUNNING=\"$(kubectl get rollout app -n app-canary \\\
        \n  -o jsonpath='{.spec.template.spec.containers[0].image}')\"\necho \"running:\
        \ $RUNNING\"\necho \"$RUNNING\" | grep -q \":${IMAGE_TAG}$\" || {\n  echo\
        \ \"MISMATCH: expected tag ${IMAGE_TAG}\"; exit 1; }\n"
    - name: Observability reconciled, and ArgoCD itself is scrapeable (trap 2)
      run: "set -euo pipefail\nkubectl wait --for=jsonpath='{.status.health.status}'=Healthy\
        \ \\\n  application/observability -n argocd --timeout=1200s\nkubectl get svc\
        \ argocd-application-controller-metrics -n argocd\nkubectl get servicemonitor\
        \ argocd-application-controller -n monitoring\n"
    - name: "selfHeal did not revert the deploy (spec \xA74 rule 4)"
      run: "set -euo pipefail\nsleep 60\nkubectl get application app-canary -n argocd\
        \ \\\n  -o jsonpath='{.status.sync.status}' | grep -q Synced || {\n  echo\
        \ \"app-canary drifted after the patch \u2014 selfHeal is fighting the pipeline\"\
        ; exit 1; }\necho \"Still Synced a minute after the patch. No loop.\"\n"
