        terraform_version: 1.9.8
    - id: tf
      name: Read cluster name from state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw cluster_name)\" >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Undo to the previous revision
      run: "set -euo pipefail\n# One click, and NOT a git revert: nothing was ever\
        \ committed, so\n# there is nothing in Git to revert. This rewinds the Rollout\
        \ to its\n# previous ReplicaSet. gitops/ is untouched, so selfHeal stays quiet.\n\
        #\n# Done with plain kubectl rather than the argo-rollouts plugin: the\n#\
        \ plugin is another downloaded binary, and this repo has already lost\n# three\
        \ attempts to binary-fetching in CI. Setting the Rollout's\n# spec.template\
        \ back to the previous ReplicaSet's pod spec is exactly\n# what `rollouts\
        \ undo` does, via the standard rollback subresource.\nPREV_RS=\"$(kubectl\
        \ get rs -n app-canary \\\n  -l app.kubernetes.io/name=app \\\n  --sort-by=.metadata.creationTimestamp\
        \ \\\n  -o jsonpath='{.items[-2:].metadata.name}' | awk '{print $1}')\"\n\
        if [ -z \"$PREV_RS\" ]; then\n  echo \"No previous ReplicaSet to roll back\
        \ to.\"; exit 1\nfi\nPREV_IMAGE=\"$(kubectl get rs \"$PREV_RS\" -n app-canary\
        \ \\\n  -o jsonpath='{.spec.template.spec.containers[0].image}')\"\necho \"\
        Rolling back to $PREV_RS ($PREV_IMAGE)\"\nkubectl patch rollout app -n app-canary\
        \ --type merge \\\n  -p \"{\\\"spec\\\":{\\\"template\\\":{\\\"spec\\\":{\\\
        \"containers\\\":[{\\\"name\\\":\\\"app\\\",\\\"image\\\":\\\"${PREV_IMAGE}\\\
        \"}]}}}}\"\nkubectl rollout status rollout/app -n app-canary --timeout=600s\
        \ || true\nkubectl get rollout app -n app-canary \\\n  -o jsonpath='{.spec.template.spec.containers[0].image}'\n"
