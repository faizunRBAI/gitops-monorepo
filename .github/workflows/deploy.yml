name: deploy
'on':
  workflow_dispatch: {}
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
      chart_changed: ${{ steps.filter.outputs.chart_changed }}
    steps:
    - uses: actions/checkout@v4
    - id: filter
      name: Classify changed paths (monorepo path discipline)
      run: "set -uo pipefail\n# `git rev-parse HEAD~1` prints TWO lines on a shallow\
        \ checkout (the\n# error plus the resolved sha), and interpolating both produced\n\
        # \"fatal: ambiguous argument 'HEAD~1\\n<sha>'\". Resolve the parent\n# explicitly\
        \ and fall back to a full build when there isn't one.\nBASE=\"$(git rev-parse\
        \ --verify --quiet 'HEAD^' || true)\"\nif [ -n \"$BASE\" ]; then\n  CHANGED=\"\
        $(git diff --name-only \"$BASE\" HEAD || true)\"\nelse\n  echo \"No parent\
        \ commit (shallow or initial) \u2014 treating as a full build.\"\n  CHANGED=\"\
        $(git ls-files || true)\"\nfi\necho \"changed files:\"; echo \"$CHANGED\"\n\
        app=false; chart=false\necho \"$CHANGED\" | grep -qE '^app/'   && app=true\
        \   || true\necho \"$CHANGED\" | grep -qE '^chart/' && chart=true || true\n\
        if echo \"$CHANGED\" | grep -qE '^(gitops|flux)/' && [ \"$app\" = false ]\
        \ && [ \"$chart\" = false ]; then\n  echo \"GitOps-only change: ArgoCD applies\
        \ this, CI does not build it.\"\nfi\necho \"app_changed=$app\" >> \"$GITHUB_OUTPUT\"\
        \necho \"chart_changed=$chart\" >> \"$GITHUB_OUTPUT\"\n"
  lint:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install (npm workspace root)
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run build --workspace app
  test:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install (npm workspace root)
      run: npm ci
    - name: Test with coverage
      run: npm run test:coverage
  security:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    env:
      RENDER_REPO: 000000000000.dkr.ecr.us-east-1.amazonaws.com/app
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Gitleaks (secret scan)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: azure/setup-helm@v4
      with:
        version: v3.16.3
    - name: Lint both charts
      run: 'set -euo pipefail

        helm lint chart/app --set image.repository="$RENDER_REPO"

        helm lint gitops/apps

        '
    - name: Render all three modes (plain-Deployment guard must exclude canary)
      run: "set -euo pipefail\nhelm template chart/app --set image.repository=\"$RENDER_REPO\"\
        \ \\\n  --set canary.enabled=true  --set blueGreen.enabled=false > /tmp/canary.yaml\n\
        helm template chart/app --set image.repository=\"$RENDER_REPO\" \\\n  --set\
        \ canary.enabled=false --set blueGreen.enabled=true  > /tmp/bg.yaml\nhelm\
        \ template chart/app --set image.repository=\"$RENDER_REPO\" \\\n  --set canary.enabled=false\
        \ --set blueGreen.enabled=false > /tmp/plain.yaml\n\ngrep -q 'kind: Rollout'\
        \    /tmp/canary.yaml || { echo \"canary did not render a Rollout\"; exit\
        \ 1; }\ngrep -q 'kind: Rollout'    /tmp/bg.yaml     || { echo \"bluegreen\
        \ did not render a Rollout\"; exit 1; }\ngrep -q 'kind: Deployment' /tmp/plain.yaml\
        \  || { echo \"plain did not render a Deployment\"; exit 1; }\n\nif grep -q\
        \ 'kind: Deployment' /tmp/canary.yaml; then\n  echo \"GUARD FAILED: plain\
        \ Deployment rendered alongside canary Rollout\"; exit 1\nfi\nif grep -q 'kind:\
        \ Deployment' /tmp/bg.yaml; then\n  echo \"GUARD FAILED: plain Deployment\
        \ rendered alongside bluegreen Rollout\"; exit 1\nfi\necho \"Plain-Deployment\
        \ guard holds in all three modes.\"\n"
    - name: Both modes at once must be rejected, not silently rendered
      run: "set -euo pipefail\nif helm template chart/app --set image.repository=\"\
        $RENDER_REPO\" \\\n     --set canary.enabled=true --set blueGreen.enabled=true\
        \ > /dev/null 2>&1; then\n  echo \"GUARD FAILED: canary + blueGreen together\
        \ should abort the render\"; exit 1\nfi\necho \"Mutual exclusion enforced.\"\
        \n"
    - name: App-of-apps renders, and commits no image tag
      run: "set -euo pipefail\nhelm template gitops/apps > /tmp/apps.yaml\nfor A in\
        \ observability scrapes dashboards label-sync app-dev app-bluegreen app-canary;\
        \ do\n  grep -q \"name: $A\" /tmp/apps.yaml || { echo \"missing Application:\
        \ $A\"; exit 1; }\ndone\n# Spec \xA74 rule 2: a committed image.tag parameter\
        \ would be reverted by\n# selfHeal on the next reconcile, silently undoing\
        \ every deploy.\nif grep -q 'name: image.tag' /tmp/apps.yaml; then\n  echo\
        \ \"GUARD FAILED: image.tag is committed in gitops/apps \u2014 selfHeal will\
        \ fight the pipeline\"; exit 1\nfi\necho \"No committed image.tag. Deploys\
        \ stay out of Git.\"\n"
    - name: "ArgoCD watches only gitops/ (spec \xA74 rule 1)"
      run: "set -euo pipefail\nhelm template gitops/apps > /tmp/apps.yaml\n# chart/app\
        \ is legitimately referenced (Argo READS the chart), but a\n# path under app/\
        \ or .github/ would mean Argo owns pipeline inputs.\nif grep -E '^\\s+path:\
        \ (app|\\.github)(/|$)' /tmp/apps.yaml; then\n  echo \"GUARD FAILED: an Application\
        \ points at app/ or .github/\"; exit 1\nfi\necho \"No Application watches\
        \ app/ or .github/.\"\n"
  build-push:
    runs-on: ubuntu-latest
    needs:
    - lint
    - test
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
    - id: meta
      name: Compute immutable tag
      run: echo "image_tag=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
    - id: ecr
      name: Login to ECR
      run: "set -euo pipefail\nACCOUNT=\"$(aws sts get-caller-identity --query Account\
        \ --output text)\"\naws ecr get-login-password --region \"$AWS_REGION\" \\\
        \n  | docker login --username AWS --password-stdin \"$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com\"\
        \n# Registry host only (account id, no project name) \u2014 not\n# secret-derived,\
        \ so it survives as a step output.\necho \"repo=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Build (immutable tag, no reuse)
      run: "set -euo pipefail\nREPO=\"${{ steps.ecr.outputs.repo }}/${{ secrets.PROJECT_NAME\
        \ }}\"\nTAG=\"${{ steps.meta.outputs.image_tag }}\"\nif aws ecr describe-images\
        \ --repository-name \"${{ secrets.PROJECT_NAME }}\" \\\n     --image-ids imageTag=\"\
        $TAG\" >/dev/null 2>&1; then\n  echo \"Tag $TAG already exists in ECR \u2014\
        \ refusing to overwrite (trap 1).\"; exit 1\nfi\n# Context is the repo ROOT:\
        \ app/ is an npm workspace and the lockfile\n# that `npm ci` needs lives at\
        \ the root, outside ./app.\ndocker build -f app/Dockerfile -t \"$REPO:$TAG\"\
        \ .\n"
    - name: Scan the image BEFORE it is pushed
      run: "set -euo pipefail\nREPO=\"${{ steps.ecr.outputs.repo }}/${{ secrets.PROJECT_NAME\
        \ }}\"\nTAG=\"${{ steps.meta.outputs.image_tag }}\"\n# Trivy runs from its\
        \ OWN published image. Three earlier attempts\n# failed on ways of getting\
        \ a trivy BINARY onto the runner:\n#   - contrib install.sh, v0.58.1  -> resolved\
        \ the release, exit 1\n#   - contrib install.sh, v0.63.0  -> identical failure\n\
        #   - aquasecurity/trivy-action@0.28.0 -> action ref does not exist\n# Docker\
        \ is already present and authenticated in this job, so running\n# the official\
        \ image removes the installer and the marketplace ref\n# entirely. The image\
        \ is scanned from the local docker daemon (it has\n# not been pushed yet),\
        \ which is why the socket is mounted.\ndocker run --rm \\\n  -v /var/run/docker.sock:/var/run/docker.sock\
        \ \\\n  -v \"$HOME/.cache/trivy:/root/.cache/trivy\" \\\n  aquasec/trivy:0.58.1\
        \ image \\\n    --severity HIGH,CRITICAL \\\n    --exit-code 1 \\\n    --ignore-unfixed\
        \ \\\n    --format table \\\n    \"$REPO:$TAG\"\n"
    - name: Push
      run: 'set -euo pipefail

        REPO="${{ steps.ecr.outputs.repo }}/${{ secrets.PROJECT_NAME }}"

        docker push "$REPO:${{ steps.meta.outputs.image_tag }}"

        '
  provision:
    runs-on: ubuntu-latest
    needs:
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_repo_url: ${{ secrets.GITOPS_REPO_URL }}
      TF_VAR_branch: main
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
