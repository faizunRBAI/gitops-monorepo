# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: deploy
'on':
  workflow_dispatch: {}
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
      chart_changed: ${{ steps.filter.outputs.chart_changed }}
    steps:
    - uses: actions/checkout@v4
    - id: filter
      name: Classify changed paths (monorepo path discipline)
      run: "set -euo pipefail\nBASE=\"$(git rev-parse HEAD~1 2>/dev/null || git rev-parse\
        \ HEAD)\"\nCHANGED=\"$(git diff --name-only \"$BASE\" HEAD || true)\"\necho\
        \ \"changed files:\"; echo \"$CHANGED\"\napp=false; chart=false\necho \"$CHANGED\"\
        \ | grep -qE '^app/'   && app=true   || true\necho \"$CHANGED\" | grep -qE\
        \ '^chart/' && chart=true || true\nif echo \"$CHANGED\" | grep -qE '^(gitops|flux)/'\
        \ && [ \"$app\" = false ] && [ \"$chart\" = false ]; then\n  echo \"GitOps-only\
        \ change: ArgoCD applies this, CI does not build it.\"\nfi\necho \"app_changed=$app\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"chart_changed=$chart\" >> \"$GITHUB_OUTPUT\"\
        \n"
  lint:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install (npm workspace root)
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npm run build --workspace app
  test:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install (npm workspace root)
      run: npm ci
    - name: Test with coverage
      run: npm run test:coverage
  security:
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    env:
      RENDER_REPO: 000000000000.dkr.ecr.us-east-1.amazonaws.com/app
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Gitleaks (secret scan)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: azure/setup-helm@v4
      with:
        version: v3.16.3
    - name: Lint both charts
      run: 'set -euo pipefail

        helm lint chart/app --set image.repository="$RENDER_REPO"

        helm lint gitops/apps

        '
    - name: Render all three modes (plain-Deployment guard must exclude canary)
      run: "set -euo pipefail\nhelm template chart/app --set image.repository=\"$RENDER_REPO\"\
        \ \\\n  --set canary.enabled=true  --set blueGreen.enabled=false > /tmp/canary.yaml\n\
        helm template chart/app --set image.repository=\"$RENDER_REPO\" \\\n  --set\
        \ canary.enabled=false --set blueGreen.enabled=true  > /tmp/bg.yaml\nhelm\
        \ template chart/app --set image.repository=\"$RENDER_REPO\" \\\n  --set canary.enabled=false\
        \ --set blueGreen.enabled=false > /tmp/plain.yaml\n\ngrep -q 'kind: Rollout'\
        \    /tmp/canary.yaml || { echo \"canary did not render a Rollout\"; exit\
        \ 1; }\ngrep -q 'kind: Rollout'    /tmp/bg.yaml     || { echo \"bluegreen\
        \ did not render a Rollout\"; exit 1; }\ngrep -q 'kind: Deployment' /tmp/plain.yaml\
        \  || { echo \"plain did not render a Deployment\"; exit 1; }\n\nif grep -q\
        \ 'kind: Deployment' /tmp/canary.yaml; then\n  echo \"GUARD FAILED: plain\
        \ Deployment rendered alongside canary Rollout\"; exit 1\nfi\nif grep -q 'kind:\
        \ Deployment' /tmp/bg.yaml; then\n  echo \"GUARD FAILED: plain Deployment\
        \ rendered alongside bluegreen Rollout\"; exit 1\nfi\necho \"Plain-Deployment\
        \ guard holds in all three modes.\"\n"
    - name: Both modes at once must be rejected, not silently rendered
      run: "set -euo pipefail\nif helm template chart/app --set image.repository=\"\
        $RENDER_REPO\" \\\n     --set canary.enabled=true --set blueGreen.enabled=true\
        \ > /dev/null 2>&1; then\n  echo \"GUARD FAILED: canary + blueGreen together\
        \ should abort the render\"; exit 1\nfi\necho \"Mutual exclusion enforced.\"\
        \n"
    - name: App-of-apps renders, and commits no image tag
      run: "set -euo pipefail\nhelm template gitops/apps > /tmp/apps.yaml\nfor A in\
        \ observability scrapes dashboards label-sync app-dev app-bluegreen app-canary;\
        \ do\n  grep -q \"name: $A\" /tmp/apps.yaml || { echo \"missing Application:\
        \ $A\"; exit 1; }\ndone\n# Spec \xA74 rule 2: a committed image.tag parameter\
        \ would be reverted by\n# selfHeal on the next reconcile, silently undoing\
        \ every deploy.\nif grep -q 'name: image.tag' /tmp/apps.yaml; then\n  echo\
        \ \"GUARD FAILED: image.tag is committed in gitops/apps \u2014 selfHeal will\
        \ fight the pipeline\"; exit 1\nfi\necho \"No committed image.tag. Deploys\
        \ stay out of Git.\"\n"
    - name: "ArgoCD watches only gitops/ (spec \xA74 rule 1)"
      run: "set -euo pipefail\nhelm template gitops/apps > /tmp/apps.yaml\n# chart/app\
        \ is legitimately referenced (Argo READS the chart), but a\n# path under app/\
        \ or .github/ would mean Argo owns pipeline inputs.\nif grep -E '^\\s+path:\
        \ (app|\\.github)(/|$)' /tmp/apps.yaml; then\n  echo \"GUARD FAILED: an Application\
        \ points at app/ or .github/\"; exit 1\nfi\necho \"No Application watches\
        \ app/ or .github/.\"\n"
  build-push:
    runs-on: ubuntu-latest
    needs:
    - lint
    - test
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TRIVY_VERSION: v0.63.0
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
    - id: meta
      name: Compute immutable tag
      run: echo "image_tag=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
    - name: Login to ECR
      run: "set -euo pipefail\nACCOUNT=\"$(aws sts get-caller-identity --query Account\
        \ --output text)\"\naws ecr get-login-password --region \"$AWS_REGION\" \\\
        \n  | docker login --username AWS --password-stdin \"$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com\"\
        \n"
    - name: Build (immutable tag, no reuse)
      run: "set -euo pipefail\nACCOUNT=\"$(aws sts get-caller-identity --query Account\
        \ --output text)\"\nREPO=\"$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/${{\
        \ secrets.PROJECT_NAME }}\"\nTAG=\"${{ steps.meta.outputs.image_tag }}\"\n\
        if aws ecr describe-images --repository-name \"${{ secrets.PROJECT_NAME }}\"\
        \ \\\n     --image-ids imageTag=\"$TAG\" >/dev/null 2>&1; then\n  echo \"\
        Tag $TAG already exists in ECR \u2014 refusing to overwrite (trap 1).\"; exit\
        \ 1\nfi\n# Context is the repo ROOT: app/ is an npm workspace and the lockfile\n\
        # that `npm ci` needs lives at the root, outside ./app.\ndocker build -f app/Dockerfile\
        \ -t \"$REPO:$TAG\" .\n"
    - name: Scan the image BEFORE it is pushed
      run: "set -euo pipefail\nACCOUNT=\"$(aws sts get-caller-identity --query Account\
        \ --output text)\"\nREPO=\"$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/${{\
        \ secrets.PROJECT_NAME }}\"\n# Install into $HOME: the runner's /usr/local/bin\
        \ needs sudo.\nmkdir -p \"$HOME/.local/bin\"\ncurl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh\
        \ \\\n  | sh -s -- -b \"$HOME/.local/bin\" \"$TRIVY_VERSION\"\n# Prove the\
        \ binary is actually there before relying on it \u2014 the\n# installer can\
        \ resolve a release and still fail to place it.\n\"$HOME/.local/bin/trivy\"\
        \ --version\n\"$HOME/.local/bin/trivy\" image --severity HIGH,CRITICAL --exit-code\
        \ 1 \\\n  --ignore-unfixed \"$REPO:${{ steps.meta.outputs.image_tag }}\"\n"
    - name: Push
      run: 'set -euo pipefail

        ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

        REPO="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/${{ secrets.PROJECT_NAME
        }}"

        docker push "$REPO:${{ steps.meta.outputs.image_tag }}"

        '
  provision:
    runs-on: ubuntu-latest
    needs:
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_repo_url: ${{ secrets.GITOPS_REPO_URL }}
      TF_VAR_branch: main
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - id: tf
      name: Read cluster name from state (self-sufficient job rule)
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw cluster_name)\" >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Wait for the root app-of-apps to materialise its children
      run: "set -euo pipefail\nkubectl wait --for=jsonpath='{.status.health.status}'=Healthy\
        \ \\\n  application/root -n argocd --timeout=600s\nkubectl wait --for=create\
        \ application/app-canary -n argocd --timeout=300s\n"
    - id: prev
      name: Capture the previous tag (the rollback target)
      run: "set -euo pipefail\nPREV=\"$(kubectl get application app-canary -n argocd\
        \ \\\n  -o jsonpath='{.spec.source.helm.parameters[?(@.name==\"image.tag\"\
        )].value}' 2>/dev/null || true)\"\necho \"previous_tag=${PREV:-none}\" >>\
        \ \"$GITHUB_OUTPUT\"\necho \"Previous image tag: ${PREV:-none} (none = first\
        \ deploy)\"\n"
    - name: Patch the Application Helm parameter (deploy = cluster state, NOT a git
        commit)
      run: "set -euo pipefail\n# JSON-patch, not merge-patch: a merge on spec.source.helm\
        \ would\n# replace the whole parameters array and drop image.repository and\n\
        # the mode switches that Git owns.\nPARAMS=\"$(kubectl get application app-canary\
        \ -n argocd \\\n  -o jsonpath='{range .spec.source.helm.parameters[*]}{.name}{\"\
        \\n\"}{end}')\"\nIDX=\"$(echo \"$PARAMS\" | grep -n '^image.tag$' | cut -d:\
        \ -f1 || true)\"\nif [ -n \"$IDX\" ]; then\n  kubectl patch application app-canary\
        \ -n argocd --type json \\\n    -p \"[{\\\"op\\\":\\\"replace\\\",\\\"path\\\
        \":\\\"/spec/source/helm/parameters/$((IDX-1))/value\\\",\\\"value\\\":\\\"\
        ${IMAGE_TAG}\\\"}]\"\nelse\n  kubectl patch application app-canary -n argocd\
        \ --type json \\\n    -p \"[{\\\"op\\\":\\\"add\\\",\\\"path\\\":\\\"/spec/source/helm/parameters/-\\\
        \",\\\"value\\\":{\\\"name\\\":\\\"image.tag\\\",\\\"value\\\":\\\"${IMAGE_TAG}\\\
        \"}}]\"\nfi\necho \"app-canary image.tag -> ${IMAGE_TAG}\"\n"
    - name: Hard refresh so ArgoCD re-renders immediately
      run: "kubectl -n argocd annotate application app-canary \\\n  argocd.argoproj.io/refresh=hard\
        \ --overwrite\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    - build-push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - id: tf
      name: Read cluster name from state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw cluster_name)\" >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: App Synced + Healthy
      run: "set -euo pipefail\nkubectl wait --for=jsonpath='{.status.sync.status}'=Synced\
        \ \\\n  application/app-canary -n argocd --timeout=900s\nkubectl wait --for=jsonpath='{.status.health.status}'=Healthy\
        \ \\\n  application/app-canary -n argocd --timeout=900s\n"
    - name: The running image is the one this run built
      run: "set -euo pipefail\nRUNNING=\"$(kubectl get rollout app -n app-canary \\\
        \n  -o jsonpath='{.spec.template.spec.containers[0].image}')\"\necho \"running:\
        \ $RUNNING\"\necho \"$RUNNING\" | grep -q \":${IMAGE_TAG}$\" || {\n  echo\
        \ \"MISMATCH: expected tag ${IMAGE_TAG}\"; exit 1; }\n"
    - name: Observability reconciled, and ArgoCD itself is scrapeable (trap 2)
      run: "set -euo pipefail\nkubectl wait --for=jsonpath='{.status.health.status}'=Healthy\
        \ \\\n  application/observability -n argocd --timeout=1200s\nkubectl get svc\
        \ argocd-application-controller-metrics -n argocd\nkubectl get servicemonitor\
        \ argocd-application-controller -n monitoring\n"
    - name: "selfHeal did not revert the deploy (spec \xA74 rule 4)"
      run: "set -euo pipefail\nsleep 60\nkubectl get application app-canary -n argocd\
        \ \\\n  -o jsonpath='{.status.sync.status}' | grep -q Synced || {\n  echo\
        \ \"app-canary drifted after the patch \u2014 selfHeal is fighting the pipeline\"\
        ; exit 1; }\necho \"Still Synced a minute after the patch. No loop.\"\n"
    - name: App answers through the ingress
      run: "set -euo pipefail\nHOST=\"$(kubectl get svc -n ingress-nginx ingress-nginx-controller\
        \ \\\n  -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')\"\necho\
        \ \"ingress: $HOST\"\ncurl --fail --retry 20 --retry-delay 15 --retry-all-errors\
        \ \"http://${HOST}/healthz\"\ncurl --fail --retry 5 --retry-delay 10 --retry-all-errors\
        \ \"http://${HOST}/\" -o /dev/null\necho \"Console: http://${HOST}/argocd\
        \   Dashboards: http://${HOST}/grafana\"\n"
  rollback:
    runs-on: ubuntu-latest
    needs:
    - verify
    environment: udap-approval
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - id: tf
      name: Read cluster name from state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw cluster_name)\" >> \"$GITHUB_OUTPUT\"\n"
      working-directory: infra
    - name: Kubeconfig
      run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster
        }}"
    - name: Install the Argo Rollouts kubectl plugin
      run: "set -euo pipefail\nmkdir -p \"$HOME/.local/bin\"\ncurl -sSL -o \"$HOME/.local/bin/kubectl-argo-rollouts\"\
        \ \\\n  https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64\n\
        chmod +x \"$HOME/.local/bin/kubectl-argo-rollouts\"\necho \"$HOME/.local/bin\"\
        \ >> \"$GITHUB_PATH\"\n"
    - name: Undo to the previous revision
      run: "set -euo pipefail\n# One click, and NOT a git revert: nothing was ever\
        \ committed, so\n# there is nothing in Git to revert. This rewinds the Rollout\
        \ to its\n# previous ReplicaSet. gitops/ is untouched, so selfHeal stays quiet.\n\
        kubectl argo rollouts undo app -n app-canary\nkubectl argo rollouts status\
        \ app -n app-canary --timeout 600s\nkubectl get rollout app -n app-canary\
        \ \\\n  -o jsonpath='{.spec.template.spec.containers[0].image}'\n"
