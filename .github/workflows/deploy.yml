      run: "set -euo pipefail\nHOST=\"$(kubectl get svc -n ingress-nginx ingress-nginx-controller\
        \ \\\n  -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')\"\necho\
        \ \"ingress: $HOST\"\ncurl --fail --retry 20 --retry-delay 15 --retry-all-errors\
        \ \"http://${HOST}/healthz\"\ncurl --fail --retry 5 --retry-delay 10 --retry-all-errors\
        \ \"http://${HOST}/\" -o /dev/null\necho \"Console: http://${HOST}/argocd\
        \   Dashboards: http://${HOST}/grafana\"\n"
  rollback:
    runs-on: ubuntu-latest
    needs:
    - verify
    environment: udap-approval
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
